name: Smoke production inference

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-write-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Exercise production inference once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run production inference smoke
        run: npm run smoke:production
        env:
          SOYAOS_PRODUCTION_SMOKE_API_KEY: ${{ secrets.SOYAOS_PRODUCTION_SMOKE_API_KEY }}

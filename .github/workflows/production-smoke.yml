name: Smoke production inference

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check mode; use models-only only for revoked-key verification
        required: true
        default: full
        type: choice
        options:
          - full
          - models-only
      rounds:
        description: Full-mode rounds; each round sends exactly two Chat requests
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: production-write-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Exercise production inference safely
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run production inference smoke
        run: npm run smoke:production
        env:
          SOYAOS_PRODUCTION_SMOKE_API_KEY: ${{ secrets.SOYAOS_PRODUCTION_SMOKE_API_KEY }}
          SOYAOS_PRODUCTION_SMOKE_MODE: ${{ inputs.mode }}
          SOYAOS_PRODUCTION_SMOKE_ROUNDS: ${{ inputs.rounds }}
